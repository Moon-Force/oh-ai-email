<?xml version="1.0" encoding="UTF-8"?>
<!--
  oh-ai-email monogram (vector alternate)
  Glass "O" + Lumen capsule bar — brand/favicon when envelope is too busy at 16px
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="oh-ai-email mark">
  <defs>
    <linearGradient id="plate2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2F8"/>
      <stop offset="100%" stop-color="#C9D4E4"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#D0DCEB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9AACC4" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A4558"/>
      <stop offset="50%" stop-color="#1C2430"/>
      <stop offset="100%" stop-color="#3A4558"/>
    </linearGradient>
    <radialGradient id="dot" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8FB4FF"/>
      <stop offset="100%" stop-color="#2F6BFF"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1A2438" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#plate2)" filter="url(#sh)"/>

  <!-- Glass O -->
  <ellipse cx="256" cy="256" rx="118" ry="100"
    fill="none" stroke="url(#ring)" stroke-width="36" stroke-linecap="round"/>
  <ellipse cx="256" cy="256" rx="118" ry="100"
    fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Capsule bar (Lumen control) -->
  <rect x="118" y="232" width="276" height="48" rx="24" fill="url(#bar)" opacity="0.92"/>
  <rect x="118" y="232" width="276" height="48" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="16" fill="url(#dot)"/>
  <circle cx="250" cy="250" r="4" fill="#FFFFFF" opacity="0.5"/>
</svg>
