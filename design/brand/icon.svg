<?xml version="1.0" encoding="UTF-8"?>
<!--
  oh-ai-email mark (vector)
  Concept: glass envelope fold + Lumen orb (AI)
  Colors: Mist plate / glass stroke / Lumen Blue #2F6BFF
  Use for favicon, tray, in-app; prefer PNG masters for store marketing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="oh-ai-email">
  <defs>
    <linearGradient id="plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7E0EC"/>
      <stop offset="50%" stop-color="#C5D0E0"/>
      <stop offset="100%" stop-color="#B8C4D6"/>
    </linearGradient>
    <linearGradient id="glass" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#E8EEF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A8B8D0" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="lumen" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8FB4FF"/>
      <stop offset="45%" stop-color="#2F6BFF"/>
      <stop offset="100%" stop-color="#1A4FD6"/>
    </radialGradient>
    <radialGradient id="lumenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2F6BFF" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#2F6BFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1A2438" flood-opacity="0.18"/>
    </filter>
    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App plate -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#plate)" filter="url(#softShadow)"/>
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#plate)" stroke="url(#glassStroke)" stroke-width="2" opacity="0.9"/>

  <!-- Envelope body (glass) -->
  <g transform="translate(256 268)">
    <rect x="-132" y="-72" width="264" height="168" rx="28" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.5"/>
    <!-- Flap folds -->
    <path d="M-132 -44 L0 48 L132 -44" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-132 -44 L0 -100 L132 -44" fill="url(#glass)" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Specular edge -->
    <path d="M-120 -92 Q0 -118 120 -92" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Lumen orb + glow -->
  <circle cx="256" cy="248" r="48" fill="url(#lumenGlow)"/>
  <circle cx="256" cy="248" r="28" fill="url(#lumen)" filter="url(#orbGlow)"/>
  <circle cx="246" cy="238" r="8" fill="#FFFFFF" opacity="0.55"/>
</svg>
